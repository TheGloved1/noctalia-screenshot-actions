# Screenshot Actions — Region capture → menu for Swappy markup or OCR
#
# Usage: Press SUPER+SHIFT+S to capture a region, then choose:
#   - Open in Swappy (markup/annotation)
#   - Find Text (OCR with inline result panel)
#
# Dependencies: slurp, grim, swappy, tesseract, wl-copy, notify-send

id = "gloves/screenshot-actions"
name = "Screenshot Actions"
version = "1.0.0"
plugin_api = 13
author = "gloves"
license = "MIT"
description = "Region screenshot → menu for Swappy markup or OCR"
tags = ["screenshot", "ocr", "annotate", "utility"]
dependencies = [
  "slurp",
  "grim",
  "swappy",
  "tesseract",
  "wl-copy",
  "notify-send",
]

# ── Settings (editable in Settings → Plugins) ──

[[setting]]
key = "screenshot-path"
type = "folder"
label_key = "settings.screenshot_path.label"
description_key = "settings.screenshot_path.description"
default = "~/Pictures/Screenshots"

[[setting]]
key = "filename-format"
type = "string"
label_key = "settings.filename_format.label"
description_key = "settings.filename_format.description"
default = "%Y-%b_%H-%M-%S"

[[setting]]
key = "ocr-language"
type = "string"
label_key = "settings.ocr_language.label"
description_key = "settings.ocr_language.description"
default = "eng"

[[setting]]
key = "panel-placement"
type = "string"
label_key = "settings.panel_placement.label"
description_key = "settings.panel_placement.description"
default = "floating"

[[setting]]
key = "panel-along-bar"
type = "string"
label_key = "settings.panel_along_bar.label"
description_key = "settings.panel_along_bar.description"
default = "center"

# ── Entries ──

# Bar widget: crosshair glyph. Left click → immediate region capture.
[[widget]]
id = "widget"
entry = "widget.luau"

# Control-center quick tile. Mirrors the bar widget.
[[shortcut]]
id = "toggle"
entry = "shortcut.luau"

# Main action menu: image preview + 2 buttons (Open / Find Text)
[[panel]]
id = "actions"
entry = "panel.luau"
width = 480
height = 320
keyboard_focus = "on_demand"
capture_keys = [
  "Tab",
  "Backtab",
  "Up",
  "Down",
  "Left",
  "Right",
  "Return",
  "Enter",
  "Space",
  "Escape",
]

# Inline OCR result panel: editable text + copy button
[[panel]]
id = "ocr-result"
entry = "result.luau"
width = 560
height = 480

# Headless capture coordinator
[[service]]
id = "service"
entry = "service.luau"